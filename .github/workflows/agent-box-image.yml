# Builds the agent box image (images/agent-box) and pushes it to GHCR as
# :<short-sha> and :latest. Every action is pinned to a full commit SHA, with
# its version as a comment. To bump one, resolve the new tag to its commit:
#   gh api repos/<owner>/<repo>/git/ref/tags/<tag>
# (an annotated tag points at a tag object; follow it to the commit).
name: agent-box image

on:
  push:
    branches: [master]
    paths:
      - images/agent-box/**
      - .github/workflows/agent-box-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - id: tag
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Bump newTag in apps/base/agent-box/kustomization.yaml to the short
      # SHA to roll the boxes onto a new image.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: images/agent-box
          push: true
          tags: |
            ghcr.io/williamveale/agent-box:${{ steps.tag.outputs.short }}
            ghcr.io/williamveale/agent-box:latest
          labels: |
            org.opencontainers.image.source=https://github.com/WilliamVeale/Homelab
