# Builds the agent box image (images/agent-box) and pushes it to GHCR as
# :<short-sha> and :latest. Every action is pinned to a full commit SHA, with
# its version as a comment. To bump one, resolve the new tag to its commit:
#   gh api repos/<owner>/<repo>/git/ref/tags/<tag>
# (an annotated tag points at a tag object; follow it to the commit).
#
# A push builds the image only; set newTag by hand to roll the boxes.
# The weekly run updates Claude Code and rolls the boxes by itself:
#   update  pin CLAUDE_CODE_VERSION to npm's "stable" Claude Code (about a
#           week behind "latest"; it skips releases with bad regressions),
#           only if that is newer than the pin, and push it to master
#   build   build that commit
#   roll    set newTag to it and push; Flux restarts every box
# GITHUB_TOKEN pushes do not start workflow runs, so these pushes do not
# start a second build. Run it by hand: Actions > agent-box image > Run
# workflow > tick "update". A failed build leaves the pin pushed but the
# boxes on the old image: re-run the failed jobs.
name: agent-box image

on:
  push:
    branches: [master]
    paths:
      - images/agent-box/**
      - .github/workflows/agent-box-image.yml
  workflow_dispatch:
    inputs:
      update:
        description: Update Claude Code to npm stable first, then roll the boxes
        type: boolean
        default: false
  schedule:
    # Sunday 08:17 UTC: 03:17 EST, 04:17 EDT.
    - cron: "17 8 * * 0"

concurrency:
  group: agent-box-image
  cancel-in-progress: false

permissions: {}

jobs:
  update:
    if: github.event_name == 'schedule' || inputs.update
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.bump.outputs.sha }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: master

      - id: bump
        run: |
          file=images/agent-box/Dockerfile
          new=$(npm view @anthropic-ai/claude-code dist-tags.stable)
          cur=$(sed -n 's/^ARG CLAUDE_CODE_VERSION=//p' "$file")
          semver='^[0-9]+\.[0-9]+\.[0-9]+$'
          if ! [[ $new =~ $semver && $cur =~ $semver ]]; then
            echo "::error::unexpected version: stable '$new', pinned '$cur'"
            exit 1
          fi
          if [ "$(printf '%s\n' "$cur" "$new" | sort -V | tail -n1)" = "$cur" ]; then
            echo "Pinned $cur, npm stable $new: nothing to do."
            exit 0
          fi
          sed -i "s/^ARG CLAUDE_CODE_VERSION=.*/ARG CLAUDE_CODE_VERSION=$new/" "$file"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "agent-box: Claude Code $cur -> $new" -- "$file"
          git push -q origin HEAD:master
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$new" >> "$GITHUB_OUTPUT"

  build:
    needs: update
    # A push or plain manual run skips "update" and builds. An update run
    # builds only when "update" pushed a new pin.
    if: ${{ !cancelled() && (needs.update.result == 'skipped' || needs.update.outputs.sha != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.short }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.update.outputs.sha || github.sha }}

      - id: tag
        run: |
          sha=$(git rev-parse HEAD)
          echo "short=${sha::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: images/agent-box
          push: true
          tags: |
            ghcr.io/williamveale/agent-box:${{ steps.tag.outputs.short }}
            ghcr.io/williamveale/agent-box:latest
          labels: |
            org.opencontainers.image.source=https://github.com/WilliamVeale/Homelab

  roll:
    needs: [update, build]
    if: needs.update.outputs.sha != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: master

      - env:
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.update.outputs.version }}
        run: |
          file=apps/base/agent-box/kustomization.yaml
          [[ $TAG =~ ^[0-9a-f]{7}$ ]] || { echo "::error::bad tag '$TAG'"; exit 1; }
          sed -i "s/^\(    newTag: \).*/\1$TAG/" "$file"
          grep -q "^    newTag: $TAG$" "$file" || { echo "::error::newTag not set"; exit 1; }
          if git diff --quiet -- "$file"; then
            echo "newTag is already $TAG."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "agents: roll boxes to image $TAG (Claude Code $VERSION)" -- "$file"
          git push -q origin HEAD:master
