apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  interval: 30m
  chart:
    spec:
      chart: tailscale-operator
      version: "1.104.2"
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: tailscale
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    # oauth is left empty on purpose: the chart then mounts the Secret
    # operator-oauth (keys client_id, client_secret), which is SOPS-encrypted
    # in apps/staging/tailscale-operator.
    operatorConfig:
      hostname: homelab-operator
