apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vikunja
  name: vikunja
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vikunja
  template:
    metadata:
      labels:
        app: vikunja
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - image: vikunja/vikunja:2.5.0
        name: vikunja
        ports:
          - containerPort: 3456
        env:
          - name: VIKUNJA_SERVICE_PUBLICURL
            value: "https://vikunja.williamveale.net/"
          - name: VIKUNJA_DATABASE_TYPE
            value: "sqlite"
          - name: VIKUNJA_DATABASE_PATH
            value: "/db/vikunja.db"
          - name: VIKUNJA_SERVICE_ENABLEREGISTRATION
            value: "false"
        envFrom:
          - secretRef:
              name: vikunja-env
        securityContext:
          allowPrivilegeEscalation: false
        readinessProbe:
          httpGet:
            path: /health
            port: 3456
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 3456
          initialDelaySeconds: 30
          periodSeconds: 20
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
        volumeMounts:
          - name: db
            mountPath: /db
          - name: files
            mountPath: /app/vikunja/files
      volumes:
        - name: db
          persistentVolumeClaim:
            claimName: vikunja-db-pvc
        - name: files
          persistentVolumeClaim:
            claimName: vikunja-files-pvc
