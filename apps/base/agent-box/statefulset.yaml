# One agent box. Each box overlay in apps/staging/agents/<name> adds a name
# suffix, its own box-config and box-secrets (GH_TOKEN for its repo only),
# and its Tailscale hostname. The ConfigMap and Secrets that every box shares
# live in apps/staging/agents and must exist before a box starts.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agent-box
  labels:
    app.kubernetes.io/name: agent-box
spec:
  serviceName: agent-box
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-box
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-box
    spec:
      # No Kubernetes API access from inside a box, and no service env vars.
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        homelab/role: agents
      tolerations:
        - key: dedicated
          operator: Equal
          value: agents
          effect: NoSchedule
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        # Fix ownership on the first start only. Otherwise every restart
        # walks the whole PVC and gives the group write on every file.
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: box
          image: ghcr.io/williamveale/agent-box
          ports:
            - name: ssh
              containerPort: 2222
          envFrom:
            - configMapRef:
                name: box-config
            - secretRef:
                name: box-secrets
            - secretRef:
                name: claude-token
            # VIKUNJA_URL and VIKUNJA_TOKEN for the /kanban skill.
            - secretRef:
                name: vikunja-token
            # SHARED_REPO and KANBAN_REPO, the repos every box reads.
            - configMapRef:
                name: agent-box-shared
            # SHARED_RO_TOKEN: Contents read on the shared repos, nothing more.
            - secretRef:
                name: shared-ro-token
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 6Gi
          readinessProbe:
            tcpSocket:
              port: ssh
            periodSeconds: 10
          volumeMounts:
            - name: home
              mountPath: /home/agent
            - name: run
              mountPath: /run/agent-box
            - name: authorized-keys
              mountPath: /etc/agent-box
              readOnly: true
      volumes:
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: authorized-keys
          configMap:
            name: agent-box-authorized-keys
  volumeClaimTemplates:
    - metadata:
        name: home
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 50Gi
