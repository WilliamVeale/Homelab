apiVersion: v1
kind: Service
metadata:
  name: agent-box
  labels:
    app.kubernetes.io/name: agent-box
  annotations:
    # The Tailscale operator puts this Service on the tailnet. Each box
    # overlay sets tailscale.com/hostname to ws-<name>.
    tailscale.com/expose: "true"
    tailscale.com/tags: "tag:agent-box"
spec:
  selector:
    app.kubernetes.io/name: agent-box
  ports:
    - name: ssh
      port: 22
      targetPort: ssh
