apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/agent-box
  - box-secrets.yaml
nameSuffix: -vikunja
labels:
  - pairs:
      app.kubernetes.io/instance: vikunja
    includeSelectors: true
configMapGenerator:
  - name: box-config
    literals:
      - BOX_NAME=vikunja
      - BOX_REPO=WilliamVeale/vikunja
      - GIT_USER_NAME=William Veale
      - GIT_USER_EMAIL=wveale@utk.edu
patches:
  - target:
      kind: Service
    patch: |-
      - op: add
        path: /metadata/annotations/tailscale.com~1hostname
        value: ws-vikunja
