# Non-secret values every box shares. The base StatefulSet reads this with
# envFrom. A plain ConfigMap, not a generator, so its name has no hash and
# the box overlays can refer to it. Pods read it only at start: restart the
# boxes after a change.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-box-shared
data:
  # Shared skills and global rules, cloned read-only to ~/claude-memory.
  SHARED_REPO: WilliamVeale/claude-memory
  # The /kanban skill, cloned read-only to ~/projects/vikunja unless it is
  # the box's own repo.
  KANBAN_REPO: WilliamVeale/vikunja
