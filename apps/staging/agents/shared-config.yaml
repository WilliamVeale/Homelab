# Non-secret values every box shares. The base StatefulSet reads this with
# envFrom. A plain ConfigMap, not a generator, so its name has no hash and
# the box overlays can refer to it. Pods read it only at start: restart the
# boxes after a change.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-box-shared
data:
  # Shared skills and global rules, cloned read-only to ~/claude-memory.
  SHARED_REPO: WilliamVeale/claude-memory
  # The /kanban skill, cloned read-only to ~/projects/vikunja unless it is
  # the box's own repo.
  KANBAN_REPO: WilliamVeale/vikunja
  # Research and specs from box general, cloned read-only to
  # ~/projects/notebook (images/agent-box/notebook-pull) unless it is the
  # box's own repo. A clone only: nothing loads it into a session's context.
  NOTEBOOK_REPO: WilliamVeale/notebook
  # Repos every box may read and never works on: how the Drupal sites and
  # the AKS cluster are built, so a box can write a spec that fits them.
  # Read-only mirrors in ~/reference (images/agent-box/reference-pull),
  # refreshed at every session start. Clones only: nothing loads them into a
  # session's context. A box that works on one of them (BOX_REPO,
  # EXTRA_REPOS) keeps its working copy in ~/projects and gets no mirror.
  # Public repos need no token. Private ones (volumes) need
  # REFERENCE_RO_TOKEN, Secret reference-ro-token. Taking a repo off this
  # list removes its mirror from every box.
  REFERENCE_REPOS: >-
    utkdigitalinitiatives/mccarthy-index
    utkdigitalinitiatives/mccarthy-infra
    utkdigitalinitiatives/volumes
    utkdigitalinitiatives/volumes-infra
    utkdigitalinitiatives/lib-main
    utkdigitalinitiatives/lib-main-infra
    utkdigitalinitiatives/Asimov-k8s
  # Claude Code mods, loaded like `claude --plugin-dir`. They live in the
  # shared repo above, so a mod edit reaches boxes at the next session start.
  # Separate paths with ':'.
  CLAUDE_CODE_PLUGIN_DIRS: /home/agent/claude-memory/global/mods/context-meter
