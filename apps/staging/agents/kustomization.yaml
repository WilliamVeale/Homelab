apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agents
resources:
  - namespace.yaml
  - networkpolicy.yaml
  - authorized-keys.yaml
  - claude-token-secret.yaml
  - vikunja-token-secret.yaml
  - shared-config.yaml
  - mcp-servers.yaml
  # SHARED_RO_TOKEN: read-only token for the shared repos. Uncomment once
  # scripts/seal-secret.sh has written the file; an entry for a missing file
  # breaks the whole apps Kustomization. No box can start without it.
  - shared-ro-token-secret.yaml
  # REFERENCE_RO_TOKEN: read-only token for the private repos in
  # REFERENCE_REPOS (shared-config.yaml). Uncomment once
  # scripts/seal-secret.sh has written the file. Boxes start without it and
  # mirror only the public repos.
  # - reference-ro-token-secret.yaml
  # Boxes. scripts/new-box.sh appends to this list.
  - vikunja
  - volumes-infra
  - general
  - lens
