apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vikunja-only-from-cloudflared
spec:
  podSelector:
    matchLabels:
      app: vikunja
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: cloudflared
      ports:
        - port: 3456
          protocol: TCP
