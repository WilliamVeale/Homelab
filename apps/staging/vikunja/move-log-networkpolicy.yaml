# Lets the vikunja-move-log CronJob reach the API in-cluster. NetworkPolicies
# add up, so this widens vikunja-only-from-cloudflared without touching it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vikunja-from-move-log
spec:
  podSelector:
    matchLabels:
      app: vikunja
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: vikunja-move-log
      ports:
        - port: 3456
          protocol: TCP
