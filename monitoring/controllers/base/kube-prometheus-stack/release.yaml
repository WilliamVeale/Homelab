apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  # This stack is slow to converge; 5m (the default) is not enough.
  timeout: 20m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "88.x"

      # version: "69.x"
      # version: "58.x"

      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
        namespace: monitoring
      interval: 12h
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
    ignore:
      # Ignore "validated" annotation which is not inserted during install
      - paths: ["/metadata/annotations/prometheus-operator-validated"]
        target:
          kind: PrometheusRule
  values:
    grafana:
      admin:
        existingSecret: grafana-secret
        userKey: admin-user
        passwordKey: admin-password
      # Without this Grafana keeps its SQLite database on an emptyDir, so
      # hand-made dashboards, users and preferences are lost on every restart.
      persistence:
        enabled: true
        type: pvc
        storageClassName: local-path
        accessModes:
          - ReadWriteOnce
        size: 5Gi
      # RWO claim + SQLite: never let two pods run at once.
      deploymentStrategy:
        type: Recreate
    prometheus:
      prometheusSpec:
        # ~0.6 GB/day at the current ~104k active series.
        retention: 90d
        # Hard cap well under the claim so compaction and the WAL have room.
        # local-path does not support volume expansion, so the claim cannot
        # be grown later without recreating it.
        retentionSize: 50GB
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 60Gi
